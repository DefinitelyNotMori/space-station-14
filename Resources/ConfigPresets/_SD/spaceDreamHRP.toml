# Space Dream - HRP
# Watchdog server.toml for prod instance MUST contain:
#   [config]
#   presets = "_SD/spaceDreamCore,_SD/spaceDreamHRP"
#   [net]
#   port = 1212
#
# Presets only set defaults; net.port in server.toml overrides them.

[net]
port = 1212

[game]
hostname = "[RU][18+][HRP] Space Dream"
desc = "Русскоязычный сервер повышенного ролевого отыгрыша (HRP) для игроков 18+."
defaultpreset = "secret"
fallbackpreset = "Extended"
fallbackenabled = true
map_pool = "DefaultMapPool"

[status]
connectaddress = "udp://ss14.pw/play/spacedream"

[hub]
tags = "18+,lang:ru,rp:high,region:eu_e,no_tag_infer"
server_url = "ss14s://ss14.pw/play/spacedream"

[chat]
motd = "Добро пожаловать на Space Dream!"

[events]
enabled = true
